name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate templates
        run: bun scripts/build-templates.mjs --check
      - name: Unit tests
        run: bun test .test.js
      - name: Build
        run: bun run build
